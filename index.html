<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d0d;
            color: #ffffff;
        }

        /* Background Canvas and Layers */
        #bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.65) blur(3px);
            transform: scale(1.05);
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* Tap to Enter Overlay */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .overlay-text {
            font-size: 1.1rem;
            letter-spacing: 4px;
            color: #eaeaea;
            font-weight: 500;
            text-transform: uppercase;
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Container View */
        .wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Main Profile Card */
        #main-card {
            width: 100%;
            max-width: 420px;
            background: rgba(18, 18, 20, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            opacity: 0;
            transform: scale(0.96) translateY(12px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #main-card.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Profile Header */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .username {
            font-size: 1.45rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.25);
        }

        .badges-container {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2));
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            text-decoration: none;
            color: #d1d5db;
            transition: all 0.25s ease;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ss-icon-box {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
        }

        .ss-icon-box svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .btn-label {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .arrow-icon {
            width: 16px;
            height: 16px;
            opacity: 0.6;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .social-btn:hover .arrow-icon {
            opacity: 1;
            transform: translate(2px, -2px);
        }

        /* Custom Audio Player Container (Replaced Spotify Embed) */
        #audio-container {
            width: 100%;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 10px 14px;
        }

        .audio-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .audio-play-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .audio-play-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .audio-play-btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .audio-title-box {
            display: flex;
            flex-direction: column;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #eaeaea;
        }

        .audio-status {
            font-size: 0.75rem;
            color: #8c8c8c;
        }

        /* Animated soundwave bars */
        .sound-wave {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .sound-wave .bar {
            width: 3px;
            height: 4px;
            background: #ffffff;
            border-radius: 2px;
            opacity: 0.4;
            transition: height 0.2s ease;
        }

        .sound-wave.playing .bar {
            opacity: 0.9;
            animation: bounceWave 1.1s infinite ease-in-out alternate;
        }

        .sound-wave.playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .sound-wave.playing .bar:nth-child(2) { animation-delay: 0.3s; }
        .sound-wave.playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .sound-wave.playing .bar:nth-child(4) { animation-delay: 0.4s; }

        @keyframes bounceWave {
            0% { height: 4px; }
            100% { height: 16px; }
        }
    </style>
</head>
<body>

    <!-- Background Layer -->
    <div id="bg-layer"></div>

    <!-- Snow Particles Canvas -->
    <canvas id="snow-canvas"></canvas>

    <!-- Tap to Enter Overlay -->
    <div id="overlay">
        <span class="overlay-text" id="overlay-sub">[ Click to Enter ]</span>
    </div>

    <!-- Wrapper -->
    <div class="wrapper">
        <!-- Main Profile Card -->
        <div id="main-card">
            <div class="profile-header">
                <span class="username" id="display-username"></span>
                <div class="badges-container" id="badges-container"></div>
            </div>

            <div class="social-buttons" id="socials-container">
                <!-- Telegram Button -->
                <a href="#" target="_blank" id="btn-telegram" class="social-btn" style="display: none;">
                    <div class="btn-left">
                        <div class="ss-icon-box">

                        </div>
                        <span class="btn-label">: tg</span>
                    </div>
                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>

                <!-- Discord Button -->
                <a href="#" target="_blank" id="btn-discord" class="social-btn" style="display: none;">
                    <div class="btn-left">
                        <div class="ss-icon-box">
                            <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                        </div>
                        <span class="btn-label">: dc</span>
                    </div>
                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>

                <!-- Instagram Button -->
                <a href="#" target="_blank" id="btn-instagram" class="social-btn" style="display: none;">
                    <div class="btn-left">
                        <div class="ss-icon-box">
                            <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                        </div>
                        <span class="btn-label">: ig</span>
                    </div>
                    <svg class="arrow-icon" viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
            </div>

            <!-- Custom Audio Container (Clean replacement for Spotify) -->
            <div id="audio-container" style="display: none;">
                <div class="audio-info">
                    <button class="audio-play-btn" id="audio-toggle-btn" aria-label="Toggle Audio">
                        <!-- Play / Pause Icon -->
                        <svg id="audio-icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                        <svg id="audio-icon-play" style="display: none;" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <div class="audio-title-box">
                        <span class="audio-title">Background Audio</span>
                        <span class="audio-status" id="audio-status-text">Playing</span>
                    </div>
                </div>
                <div class="sound-wave playing" id="sound-wave">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Configuration -->
    <script src="config.js"></script>

    <script>
        // Background Initialization
        const bgLayer = document.getElementById('bg-layer');

        if (CONFIG.backgroundType === "video") {
            const videoElem = document.createElement('video');
            videoElem.id = "bg-video";
            videoElem.src = CONFIG.backgroundUrl;
            videoElem.autoplay = true;
            videoElem.loop = true;
            videoElem.muted = true;
            videoElem.playsInline = true;
            videoElem.setAttribute("muted", "");
            videoElem.setAttribute("playsinline", "");
            bgLayer.appendChild(videoElem);
            videoElem.play().catch(e => console.log(e));
        } else {
            bgLayer.classList.add('img-bg');
            bgLayer.style.backgroundImage = `url('${CONFIG.backgroundUrl}')`;
        }

        // Subtitle & Username
        document.getElementById('overlay-sub').textContent = CONFIG.subtitle;
        document.getElementById('display-username').textContent = CONFIG.username;

        // Render Badges
        const badgesContainer = document.getElementById('badges-container');
        if (CONFIG.badges && Array.isArray(CONFIG.badges)) {
            CONFIG.badges.forEach(badgePath => {
                if (badgePath && badgePath.trim() !== "") {
                    const img = document.createElement('img');
                    img.src = badgePath;
                    img.className = 'badge-icon';
                    badgesContainer.appendChild(img);
                }
            });
        }

        // Setup Social Buttons
        const setupSocial = (elementId, linkUrl) => {
            const btn = document.getElementById(elementId);
            if (linkUrl && linkUrl.trim() !== "") {
                btn.href = linkUrl;
                btn.style.display = "flex";
            } else {
                btn.style.display = "none";
                btn.remove();
            }
        };

        setupSocial('btn-telegram', CONFIG.socials.telegram);
        setupSocial('btn-discord', CONFIG.socials.discord);
        setupSocial('btn-instagram', CONFIG.socials.instagram);

        // Native Audio Controller Setup
        const audioContainer = document.getElementById('audio-container');
        const audioToggleBtn = document.getElementById('audio-toggle-btn');
        const audioIconPlay = document.getElementById('audio-icon-play');
        const audioIconPause = document.getElementById('audio-icon-pause');
        const soundWave = document.getElementById('sound-wave');
        const audioStatusText = document.getElementById('audio-status-text');

        let bgAudio = null;

        if (CONFIG.musicUrl && CONFIG.musicUrl.trim() !== "") {
            audioContainer.style.display = "flex";
            bgAudio = new Audio(CONFIG.musicUrl);
            bgAudio.loop = true;
            bgAudio.volume = 0.5;

            // Handle manual play/pause
            audioToggleBtn.addEventListener('click', () => {
                if (!bgAudio) return;
                if (bgAudio.paused) {
                    bgAudio.play();
                    audioIconPlay.style.display = "none";
                    audioIconPause.style.display = "block";
                    soundWave.classList.add('playing');
                    audioStatusText.textContent = "Playing";
                } else {
                    bgAudio.pause();
                    audioIconPlay.style.display = "block";
                    audioIconPause.style.display = "none";
                    soundWave.classList.remove('playing');
                    audioStatusText.textContent = "Paused";
                }
            });
        }

        // Overlay Tap to Enter (Handles card reveal and unblocks browser autoplay policy)
        const overlay = document.getElementById('overlay');
        const mainCard = document.getElementById('main-card');

        overlay.addEventListener('click', () => {
            overlay.classList.add('hidden');
            mainCard.classList.add('visible');

            if (bgAudio) {
                bgAudio.play().catch(err => {
                    console.log("Audio playback failed:", err);
                    audioIconPlay.style.display = "block";
                    audioIconPause.style.display = "none";
                    soundWave.classList.remove('playing');
                    audioStatusText.textContent = "Paused";
                });
            }
        });

        // Snow Canvas Animation
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const numParticles = 60;
        const particles = [];

        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5,
                density: Math.random() * 0.5 + 0.5,
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.beginPath();
            for (let i = 0; i < numParticles; i++) {
                const p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2, true);
            }
            ctx.fill();
            updateParticles();
        }

        function updateParticles() {
            for (let i = 0; i < numParticles; i++) {
                const p = particles[i];
                p.y += p.density * 1.2;
                p.x += Math.sin(p.y * 0.02) * 0.5;

                if (p.y > canvas.height) {
                    particles[i] = {
                        x: Math.random() * canvas.width,
                        y: 0,
                        radius: p.radius,
                        density: p.density,
                        opacity: p.opacity
                    };
                }
            }
        }

        function animate() {
            drawParticles();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
